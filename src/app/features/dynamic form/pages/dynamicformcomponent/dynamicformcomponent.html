This is my dynamic form

<div style=" background-color: antiquewhite;padding: 20px;margin: 10px;border-radius: 10px;">

    <div style="padding: 10px;width: 100%;text-align: end;">
        <button style="margin-left: auto;" (click)="addEvnet()">Add Form</button>
    </div>

    <form (ngSubmit)="onSave()">

        @for( item of formgroup;let i = $index;track i){
        <div [formGroup]="$any(item)" style="background-color: burlywood; padding: 10px;border-radius: 30px;margin: 10px;">
            <div style="width: 100%;text-align: end;">
                <button type="button" (click)="removeForm(i)" >x</button>
            </div>
            <div style="margin: 10px;display: flex;">
                <div style="min-width: 50px;">
                    <label for="name">Name</label>
                </div>
                <div>
                    <input type="text" placeholder="Enter Name" formControlName="name">
                </div>
            </div>

            <div style="margin: 10px; display: flex;">
                <div style="min-width: 50px;">
                    <label for="role">Role</label>
                </div>
                <div>
                    <input type="text" placeholder="Enter Role" formControlName="role">
                </div>
            </div>
        </div>

        }

        <hr>
        <div style="margin: 10px; ">
            <button type="submit" style="padding: 5px;">Submit Form</button>

        </div>

    </form>

    <hr>
    The value will be: {{
        formArray.value|json
    }}
<hr>
@if(removedValue){

this is the removed form value   {{removedValue|json}}
}
</div>
