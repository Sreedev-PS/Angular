This is the reactive form

<div style="background-color: antiquewhite;padding: 10px; margin: 10px; border-radius: 10px;">

    <form [formGroup]="myform" (ngSubmit)="formSubmit()">

        <div style="margin: 20px;">
            <label for="name">Name</label>
            <input type="text" placeholder="Enter Name" formControlName="name">
        </div>

        <div style="margin: 20px;">
            <label for="password">Password</label>
            <input type="password" placeholder="Enter Password" formControlName="password">
        </div>

        <div>
            <button type="submit">Submit Form</button>
        </div>
    </form>

    <hr>

    this is the formValue by using formGroup Name

    {{myform.value|json}}


</div>
